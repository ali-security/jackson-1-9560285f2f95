# Sealed build: upstream jackson-1 has no GitHub Actions CI; this workflow
# reproduces the project's own Ant build (ant jars.asl) and Ant test suite
# (ant test) on the JDK the 1.9.2 release was built with (Java 6).
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated fully-qualified test classes to run via 'ant test.single' (empty = full suite)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Zulu JDK 6 and Ant 1.8.4
        id: tools
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSLO https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
          sudo tar -C /opt -xzf zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz
          curl -fsSLO https://archive.apache.org/dist/ant/binaries/apache-ant-1.8.4-bin.tar.gz
          sudo tar -C /opt -xzf apache-ant-1.8.4-bin.tar.gz
          echo "JAVA_HOME=/opt/zulu6.22.0.3-jdk6.0.119-linux_x64" >> "$GITHUB_ENV"
          echo "ANT_HOME=/opt/apache-ant-1.8.4" >> "$GITHUB_ENV"
          echo "/opt/zulu6.22.0.3-jdk6.0.119-linux_x64/bin" >> "$GITHUB_PATH"
          echo "/opt/apache-ant-1.8.4/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          ant -version

      - name: Build jars (ant jars.asl)
        run: ant jars.asl

      - name: Run tests
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ]; then
            for t in $TEST_FILTER; do
              ant test.single -Dtest="$t"
            done
          else
            ant test
          fi

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob('test/results/xml/TEST-*.xml'))
          t = f = e = s = 0
          for p in files:
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0) or 0)
              for tc in r.iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = tc.find(kind)
                      if el is not None:
                          print(f"{kind.upper()}: {tc.get('classname')}.{tc.get('name')}: {el.get('message')}")
          print(f"TOTAL classes={len(files)} tests={t} failures={f} errors={e} skipped={s} passed={t-f-e-s}")
          EOF

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jackson-mapper-asl
          path: build/jackson-mapper-asl-*.jar
          if-no-files-found: error
